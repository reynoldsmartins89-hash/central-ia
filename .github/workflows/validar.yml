name: validar

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar habilidades, agentes e fluxos
        run: python scripts/validar_habilidades.py
      - name: Testes offline
        run: python -m unittest -v
