# Fluxo fixo: do tema ao pacote de conteúdo multicanal.
# Uso: python main.py fluxo producao-editorial "Seu tema aqui"
# Cada etapa recebe a entrada original + os resultados das etapas de que depende (`depende`).
# Etapas cujas dependências já estão prontas rodam AO MESMO TEMPO (redes sociais e roteiro, por exemplo).

descricao = "Tema → dossiê → artigo-mãe → revisão → derivados para redes → imagens → carrossel → roteiro de YouTube"

[[etapas]]
agente = "pesquisador"
tarefa = "Monte o dossiê de pesquisa sobre o tema."

[[etapas]]
agente = "redator"
tarefa = "Escreva o artigo-mãe do blog usando somente o dossiê."
depende = [1]

[[etapas]]
agente = "revisor"
tarefa = "Revise criticamente o artigo-mãe e liste as correções."
depende = [1, 2]

[[etapas]]
agente = "social"
tarefa = "Crie os derivados para as redes sociais a partir do artigo-mãe, aplicando as correções da revisão."
depende = [2, 3]

[[etapas]]
agente = "diretor_de_arte"
tarefa = "Planeje as imagens de todos os canais a partir do artigo-mãe e dos derivados (blog 3, Substack 4, LinkedIn 1, Instagram 1 por lâmina)."
depende = [2, 4]

[[etapas]]
agente = "designer_carrossel"
tarefa = "Escreva as lâminas do carrossel do Instagram usando as imagens planejadas pelo diretor de arte."
depende = [4, 5]

[[etapas]]
agente = "roteirista"
tarefa = "Crie o roteiro de YouTube e Shorts a partir do artigo-mãe, aplicando as correções da revisão."
depende = [2, 3]
