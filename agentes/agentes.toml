# Equipe de agentes da Central de IA
#
# Cada agente = uma habilidade (habilidades/<categoria>/<nome>/SKILL.md)
#             + uma lista de modelos em ordem de preferência ("provedor:modelo").
# Se o primeiro modelo falhar (sem chave, sem cota, Ollama desligado...),
# o próximo da lista é usado automaticamente.
#
# Provedores: ollama, gemini, groq, anthropic, openai, deepseek, xai, moonshot,
#             qwen, zai, perplexity, openrouter, eco (teste offline)
# A ordem abaixo prioriza custo adicional ZERO: Ollama local, Gemini e Groq gratuitos.

[superagente]
habilidade = "geral/superagente"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.pesquisador]
descricao = "Pesquisa um tema e monta um dossiê com fatos, dados e fontes."
habilidade = "pesquisa/pesquisa-fontes"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.redator]
descricao = "Escreve o artigo-mãe do blog a partir de um dossiê."
habilidade = "conteudo/artigo-mae"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.social]
descricao = "Adapta um texto para Substack, LinkedIn, X, Instagram, Facebook e Threads."
habilidade = "conteudo/derivados-redes-sociais"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.roteirista]
descricao = "Cria roteiro de vídeo para YouTube e Shorts."
habilidade = "conteudo/roteiro-youtube"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.diretor_de_arte]
descricao = "Planeja as imagens de blog, Substack, LinkedIn e Instagram e as produz (banco de imagens ou IA)."
habilidade = "conteudo/direcao-de-arte"
modelos = ["gemini:gemini-3.5-flash", "groq:openai/gpt-oss-120b", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.designer_carrossel]
descricao = "Escreve as lâminas do carrossel do Instagram e as monta como imagens prontas (1080x1350)."
habilidade = "conteudo/design-carrossel"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.revisor]
descricao = "Revisa criticamente um texto: fatos, lógica, clareza e afirmações sem fonte."
habilidade = "pesquisa/revisao-critica"
# Claude é ótimo revisor; só é usado se ANTHROPIC_API_KEY existir (API é cobrada à parte).
modelos = ["anthropic:claude-sonnet-5-5", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b"]

[agentes.analista]
descricao = "Planeja e interpreta análises de dados e gera código Python de análise."
habilidade = "dados/analise-de-dados"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "deepseek:deepseek-chat", "ollama:qwen3:4b"]

[agentes.gestor]
descricao = "Transforma objetivos em plano de ação com etapas, prazos, riscos e KPIs."
habilidade = "gestao/gestao-de-projetos"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.estrategista]
descricao = "Analisa oportunidades de negócio, monetização, ofertas e canais."
habilidade = "gestao/estrategia-de-negocios"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.programador]
descricao = "Escreve e revisa código Python para automações e integrações."
habilidade = "desenvolvimento/desenvolvimento-python"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.privado]
descricao = "Processa conteúdo sensível SOMENTE no computador local (nada sai da máquina)."
habilidade = "agentes-autonomos-de-ia/ollama-local"
modelos = ["ollama:qwen3:4b"]

[agentes.generalista]
descricao = "Responde tarefas gerais quando nenhum especialista se aplica."
habilidade = "geral/generalista"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]
