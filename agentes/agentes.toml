# Equipe de agentes da Central de IA
#
# Cada agente = uma habilidade (habilidades/<categoria>/<nome>/SKILL.md)
#             + uma lista de modelos em ordem de preferência ("provedor:modelo").
# Se o primeiro modelo falhar (sem chave, sem cota, Ollama desligado...),
# o próximo da lista é usado automaticamente.
#
# Provedores: ollama, gemini, groq, anthropic, openai, deepseek, xai, moonshot,
#             qwen, zai, perplexity, openrouter, eco (teste offline)
# A ordem abaixo prioriza custo adicional ZERO: Ollama local, Gemini e Groq gratuitos.

[superagente]
habilidade = "geral/superagente"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.pesquisador]
descricao = "Pesquisa um tema e monta um dossiê com fatos, dados e fontes."
habilidade = "pesquisa/pesquisa-fontes"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]
acervo = true

[agentes.redator]
descricao = "Escreve o artigo-mãe do blog a partir de um dossiê."
habilidade = "conteudo/artigo-mae"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]
acervo = true

[agentes.social]
descricao = "Adapta um texto para Substack, LinkedIn, X, Instagram, Facebook e Threads."
habilidade = "conteudo/derivados-redes-sociais"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]
acervo = true

[agentes.roteirista]
descricao = "Cria roteiro de vídeo para YouTube e Shorts."
habilidade = "conteudo/roteiro-youtube"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]
acervo = true

[agentes.diretor_de_arte]
descricao = "Planeja as imagens de blog, Substack, LinkedIn e Instagram e as produz (banco de imagens ou IA)."
habilidade = "conteudo/direcao-de-arte"
modelos = ["gemini:gemini-3.5-flash", "groq:openai/gpt-oss-120b", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.designer_carrossel]
descricao = "Escreve as lâminas do carrossel do Instagram e as monta como imagens prontas (1080x1350)."
habilidade = "conteudo/design-carrossel"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.revisor]
descricao = "Revisa criticamente um texto: fatos, lógica, clareza e afirmações sem fonte."
habilidade = "pesquisa/revisao-critica"
# Claude é ótimo revisor; só é usado se ANTHROPIC_API_KEY existir (API é cobrada à parte).
modelos = ["anthropic:claude-sonnet-5-5", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b"]

[agentes.analista]
descricao = "Planeja e interpreta análises de dados e gera código Python de análise."
habilidade = "dados/analise-de-dados"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "deepseek:deepseek-chat", "ollama:qwen3:4b"]
acervo = true

[agentes.gestor]
descricao = "Transforma objetivos em plano de ação com etapas, prazos, riscos e KPIs."
habilidade = "gestao/gestao-de-projetos"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]

[agentes.estrategista]
descricao = "Analisa oportunidades de negócio, monetização, ofertas e canais."
habilidade = "gestao/estrategia-de-negocios"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]
acervo = true

[agentes.programador]
descricao = "Escreve e revisa código Python para automações e integrações."
habilidade = "desenvolvimento/desenvolvimento-python"
modelos = ["gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "groq:openai/gpt-oss-120b", "ollama:qwen3:4b"]

[agentes.privado]
descricao = "Processa conteúdo sensível SOMENTE no computador local (nada sai da máquina)."
habilidade = "agentes-autonomos-de-ia/ollama-local"
modelos = ["ollama:qwen3:4b"]

[agentes.generalista]
descricao = "Responde tarefas gerais quando nenhum especialista se aplica."
habilidade = "geral/generalista"
modelos = ["groq:openai/gpt-oss-120b", "gemini:gemini-3.5-flash", "gemini:gemini-flash-lite-latest", "ollama:qwen3:4b"]
acervo = true

# ============ Agentes de conhecimento (biblioteca no Google Drive) ============
# privacidade = "local": só Ollama, nada sai do seu PC.
# privacidade = "nuvem": Groq (não treina com seus dados) → Codex (sua assinatura) → Gemini → Ollama.

[agentes.geopolitica]
descricao = "Especialista em geopolítica fundamentado na sua biblioteca de cursos: relações internacionais, poder, conflitos e cenários."
habilidade = "conhecimento/geopolitica"
base = "G:/Meu Drive/Agente_Geopolitica"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.politica]
descricao = "Especialista em ciência e filosofia política fundamentado na sua biblioteca: ideologias, instituições, teoria política."
habilidade = "conhecimento/politica"
base = "G:/Meu Drive/Agente_Politica"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.filosofia_catolica]
descricao = "Especialista em filosofia e pensamento católico fundamentado na sua biblioteca: tradição, metafísica, ética e teologia."
habilidade = "conhecimento/filosofia-catolica"
base = "G:/Meu Drive/Agente_Filosofia_Catolica"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.cof]
descricao = "Especialista no Curso Online de Filosofia (COF) e e-books relacionados da sua biblioteca: filosofia, autoeducação e cultura."
habilidade = "conhecimento/cof"
base = "G:/Meu Drive/Agente_COF"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.comunicacao]
descricao = "Especialista em comunicação fundamentado na sua biblioteca: oratória, escrita, persuasão, storytelling e relacionamento."
habilidade = "conhecimento/comunicacao"
base = "G:/Meu Drive/Agente_Comunicacao"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.marketing_digital]
descricao = "Especialista em marketing digital fundamentado na sua biblioteca: tráfego, conteúdo, funis, anúncios, lançamentos e vendas."
habilidade = "conhecimento/marketing-digital"
base = "G:/Meu Drive/Agente_Marketing_Digital"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.ciencia_de_dados]
descricao = "Especialista em ciência de dados fundamentado na sua biblioteca: estatística, Python, machine learning e análise."
habilidade = "conhecimento/ciencia-de-dados"
base = "G:/Meu Drive/Agente_Ciencia_de_Dados"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.geoprocessamento]
descricao = "Especialista em geoprocessamento fundamentado na sua biblioteca: SIG, QGIS, sensoriamento remoto, cartografia e análise espacial."
habilidade = "conhecimento/geoprocessamento"
base = "G:/Meu Drive/Agente_Geoprocessamento"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

[agentes.cyberseguranca]
descricao = "Especialista em cibersegurança DEFENSIVA fundamentado na sua biblioteca. Roda só no seu PC (privado)."
habilidade = "conhecimento/cyberseguranca"
base = "G:/Meu Drive/Agente_CyberSecurity"
privacidade = "local"
modelos = ["ollama:qwen3:4b"]

[agentes.seguranca_publica]
descricao = "Especialista em segurança pública fundamentado na sua biblioteca. Roda só no seu PC (privado)."
habilidade = "conhecimento/seguranca-publica"
base = "G:/Meu Drive/Agente_Seguranca_Publica"
privacidade = "local"
modelos = ["ollama:qwen3:4b"]

[agentes.viver_de_estudo]
descricao = "Especialista do curso Viver de Estudo da sua biblioteca: empreender com conteúdo, Instagram, anúncios e formalização (MEI, nota fiscal)."
habilidade = "conhecimento/viver-de-estudo"
base = "G:/Meu Drive/Agente_Viver_de_Estudo"
privacidade = "nuvem"
modelos = ["groq:openai/gpt-oss-120b", "cli:codex", "gemini:gemini-3.5-flash", "ollama:qwen3:4b"]

# ============ Combinações recomendadas ============
# O superagente usa estas equipes quando o pedido combina com o "quando".
# Você pode criar novas: liste os agentes e descreva em que situação trabalham juntos.

[combinacoes.conteudo_digital]
agentes = ["marketing_digital", "comunicacao", "redator", "social", "revisor"]
quando = "criar, divulgar ou vender com conteúdo: posts, campanhas, newsletter, lançamentos, copy, presença nas redes"

[combinacoes.negocio_digital]
agentes = ["viver_de_estudo", "marketing_digital", "estrategista", "gestor"]
quando = "empreender, monetizar, abrir ou estruturar um negócio digital, MEI, anúncios, plano de ação comercial"

[combinacoes.analise_internacional]
agentes = ["geopolitica", "politica", "pesquisador", "revisor"]
quando = "cenários internacionais, conflitos, eleições, relações entre países, análise de conjuntura"

[combinacoes.fundamentacao_filosofica]
agentes = ["cof", "filosofia_catolica", "comunicacao", "revisor"]
quando = "temas de filosofia, ética, religião, cultura, educação ou formação da personalidade"

[combinacoes.dados_e_territorio]
agentes = ["geoprocessamento", "ciencia_de_dados", "analista", "programador"]
quando = "mapas, dados espaciais, SIG, sensoriamento remoto, análises com Python ou estatística"

[combinacoes.seguranca]
agentes = ["seguranca_publica", "cyberseguranca", "politica", "gestor"]
quando = "segurança pública, proteção de dados e sistemas, políticas e planos de segurança"
